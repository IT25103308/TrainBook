# Server
server.port=8080
server.servlet.session.tracking-modes=cookie
spring.application.name=train-booking-system

# Datasource (MySQL via XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3307/train_booking_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Mail (configure with real values when ready)
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=your_username
spring.mail.password=your_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
app.jwt.secret=your-256-bit-super-secret-jwt-key-change-this-in-production-must-be-long
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.trainbooking=DEBUG
logging.level.org.springframework.security=DEBUG

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Password recovery: local demo by default; use smtp only with configured mail credentials.
trainbook.password-reset.delivery=${TRAINBOOK_PASSWORD_RESET_DELIVERY:console}
trainbook.public-base-url=${TRAINBOOK_PUBLIC_BASE_URL:http://localhost:8080}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
