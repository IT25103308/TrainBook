<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}" href="/images/favicon.svg">
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | TrainBook</title>
  
  <link rel="stylesheet" th:href="@{/css/variables.css}" href="/css/variables.css">
  <link rel="stylesheet" th:href="@{/css/global.css}" href="/css/global.css">
  <link rel="stylesheet" th:href="@{/css/password-fields.css}">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">🔒</div>
      <h1 class="auth-title">Create New Password</h1>
      <p class="auth-subtitle">Please choose a strong new password for your account.</p>
    </div>

    <!-- Error Message -->
    <div class="alert alert-danger" th:if="${errorMessage != null}">
      <span>⚠️</span>
      <span th:text="${errorMessage}">Error message</span>
    </div>

    <!-- Reset Password Form -->
    <form th:action="@{/reset-password}" method="post">
      <!-- CSRF Token -->
      <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <!-- Token -->
      <input type="hidden" name="token" th:value="${token}" />

      <div class="form-group">
        <label class="form-label" for="password">New Password</label>
        <div class="input-icon-group password-input-group">
          <span class="icon">🔒</span>
          <input type="password" 
                 id="password" data-account-field="password" 
                 name="password" 
                 class="form-control" 
                 placeholder="At least 8 characters" 
                 required 
                 minlength="8" maxlength="72" autocomplete="new-password"
                 autofocus>
        <button type="button" class="password-visibility-button" data-password-toggle="password" aria-controls="password" aria-label="Show password" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path data-eye-slash d="m3 3 18 18" hidden/></svg></button></div>
      </div>

      <div class="form-group" style="margin-top: var(--spacing-md);">
        <label class="form-label" for="confirmPassword">Confirm New Password</label>
        <div class="input-icon-group password-input-group">
          <span class="icon">🔒</span>
          <input type="password" 
                 id="confirmPassword" 
                 name="confirmPassword" 
                 class="form-control" 
                 placeholder="Re-enter your new password" 
                 required 
                 minlength="8" maxlength="72" autocomplete="new-password">
        <button type="button" class="password-visibility-button" data-password-toggle="confirmPassword" aria-controls="confirmPassword" aria-label="Show confirm password" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path data-eye-slash d="m3 3 18 18" hidden/></svg></button></div>
      </div>

      <div id="confirmPasswordError" class="form-error" role="status" hidden></div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: var(--spacing-lg);">
        Update Password
      </button>
    </form>

    <div class="auth-footer" style="margin-top: var(--spacing-lg); text-align: center;">
      <a th:href="@{/login}" class="text-link">← Return to Login</a>
    </div>
  </div>

<script th:src="@{/js/account-fields.js}" defer></script><script th:src="@{/js/password-fields.js}" defer></script>
</body>
</html>
